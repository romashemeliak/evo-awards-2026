<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Претенденти · EVO Awards 2026</title>
<meta name="description" content="EVO Awards 2026 — претенденти: ранг, дистанція за рік, найбільший занос і цікавий факт кожного гравця.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0c;--bg-2:#14120f;--card:#29231d;--line:#3b332a;--text:#f2ebdd;--muted:#b8aa96;--red:#d9a441;--red-dim:#6e5222;--gold:#d9a441;--radius:14px;--pad:clamp(16px,4vw,40px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
.nav{position:sticky;top:0;z-index:20;background:rgba(11,12,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font:900 15px/1 Unbounded,sans-serif;text-decoration:none;white-space:nowrap}
.logo b{color:var(--red)}
.back{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap}
.back:hover{color:var(--text)}
header.top{padding:clamp(40px,7vw,80px) 0 24px}
.kicker{font:700 12px/1 Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:2px;background:var(--red)}
h1{font-size:clamp(30px,6vw,60px);font-weight:900;text-transform:uppercase;line-height:1}
.lead{color:var(--muted);max-width:680px;margin:16px 0 0;font-size:16px}

/* toolbar */
.bar{position:sticky;top:60px;z-index:10;background:rgba(11,12,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 220px;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:500 15px Manrope,sans-serif;padding:11px 14px}
.search:focus{outline:2px solid var(--red);outline-offset:1px}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px}
.seg button{font:700 13px Manrope,sans-serif;background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--red);color:#0b0c0c}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{display:inline-flex;align-items:center;gap:7px;font:700 12px Manrope,sans-serif;background:var(--bg-2);border:1px solid var(--line);color:#d8cdbb;padding:7px 11px;border-radius:999px;cursor:pointer}
.stages button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stages button[aria-pressed=true]{border-color:var(--c);color:#fff;background:color-mix(in srgb,var(--c) 18%,var(--bg-2))}
select{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:700 13px Manrope,sans-serif;padding:10px 12px}
.count{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.view{display:flex;gap:4px}

/* grid */
main{padding:24px 0 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ncard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--stage)}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#2f2821;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--stage);display:grid;place-items:center;font:900 16px/1 Unbounded,sans-serif;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.nick{font:700 15px/1.2 Unbounded,sans-serif;word-break:break-word}
.role{font-size:12px;color:var(--muted);margin-top:2px}
.role b{color:var(--stage);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0;padding:0}
.stats div{background:rgba(255,255,255,.03);border-radius:9px;padding:8px 9px;min-width:0}
.stats dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd{margin:3px 0 0;font:700 14px/1.2 Unbounded,sans-serif;white-space:nowrap}
.stats dd small{font:500 11px Manrope,sans-serif;color:var(--muted)}
.fact{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:#ddd2c0;line-height:1.45}
.fact::before{content:"★ ";color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
.pending .stats dd,.pending .fact{color:var(--muted)}
/* адмінсклад */
.staff-sec{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
.staff-sec h2{font:900 clamp(22px,3.4vw,32px)/1.1 Unbounded,sans-serif;text-transform:uppercase}
.staff-sec h2 span{font:700 14px Manrope,sans-serif;color:var(--muted);vertical-align:middle;margin-left:6px}
.staff-lead{color:var(--muted);margin:10px 0 20px;max-width:680px;font-size:15px}
.ncard.staff{background:linear-gradient(180deg,color-mix(in srgb,var(--stage) 9%,var(--card)),var(--card))}
.ncard.staff .about{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:#ddd2c0}
.ncard.staff .about.muted{color:var(--muted);font-style:italic}

/* table view */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:700 11px/1 Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;background:var(--bg-2)}
th[aria-sort]{color:var(--text)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.fact-c{white-space:normal;color:#d8cdbb;min-width:260px}
tr:hover td{background:rgba(255,255,255,.02)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--stage);margin-right:8px;vertical-align:middle}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
@media(max-width:700px){.count{margin-left:0;flex-basis:100%}.bar{position:static}}
/* гравець і адмін: обідок і смужка навпіл (--stage — етап, --stage2 — адмінсклад) */
.dual::before{background:linear-gradient(90deg,var(--stage) 50%,var(--stage2) 50%)}
.dual .avatar{box-shadow:none;width:50px;height:50px;margin:-4px;padding:2px;border:2px solid transparent;
  background:linear-gradient(#2f2821,#2f2821) content-box,linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from 180deg,var(--stage) 0 50%,var(--stage2) 0) border-box}
.dual .avatar img{border-radius:50%}
.sl-p.dual .avatar{box-shadow:none;width:36px;height:36px;margin:-3px;border-width:1px}
.dot.dual{background:linear-gradient(90deg,var(--stage) 50%,var(--stage2) 50%)}
.role .adm{color:var(--stage2)}
.nick .nm{font:600 .82em Manrope,sans-serif;color:#cfc3ae;letter-spacing:0;text-transform:none;margin-left:4px}
/* шортлист */
.sl{margin:8px 0 48px}
.sl-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.sl-head h2,.all-h{font:900 clamp(22px,3.4vw,32px)/1.1 Unbounded,sans-serif;text-transform:uppercase}
.sl-head p{color:var(--muted);font-size:14px;margin:8px 0 0;max-width:620px}
.sl-demo{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:10px;border:1px dashed rgba(217,164,65,.55);background:rgba(217,164,65,.06);font-size:13px;color:#e6dccb}
.sl-demo b{font:800 11px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sl-noms{display:grid;gap:10px;margin-top:20px}
.sl-nom{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center;padding:16px 18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg-2)}
.sl-nom h3{font:700 15px/1.25 Unbounded,sans-serif}
.sl-nom .for{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.sl-list{display:flex;flex-wrap:wrap;gap:8px}
.sl-p{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer;text-align:left;transition:border-color .15s}
.sl-p:hover,.sl-p:focus-visible{border-color:var(--stage);outline:none}
.sl-p .avatar{width:30px;height:30px;font-size:12px;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--stage)}
.sl-p span{display:grid;gap:2px;line-height:1.15}
.sl-p b{font:700 13px Manrope,sans-serif}
.sl-p small{font:700 11px Manrope,sans-serif;color:var(--stage)}
.sl-wait{font-size:13px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line)}
.all-h{margin:0 0 18px}
@media(max-width:720px){.sl-nom{grid-template-columns:1fr;gap:12px}}
/* віконце «i» у тексті */
.qi{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;margin:0 2px 0 6px;padding:0;vertical-align:2px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font:700 11px/1 Manrope,sans-serif;font-style:normal;cursor:pointer}
.qi:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qi-tip{position:absolute;left:50%;top:calc(100% + 10px);z-index:8;width:max-content;max-width:min(300px,calc(100vw - 40px));padding:12px 14px;border-radius:12px;background:#2f2821;border:1px solid rgba(217,164,65,.45);box-shadow:0 18px 40px -12px rgba(0,0,0,.8);font:500 13.5px/1.5 Manrope,sans-serif;color:#e6dccb;text-align:left;letter-spacing:0;text-transform:none;opacity:0;transform:translate(-50%,-4px);pointer-events:none;transition:opacity .15s,transform .15s}
.qi:hover .qi-tip,.qi:focus-visible .qi-tip,.qi[aria-expanded="true"] .qi-tip{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="./">EVO <b>AWARDS</b> 2026</a>
  <a class="back" href="./#nominees">← На головну</a>
</div></header>

<div class="wrap"><header class="top">
  <div class="kicker">Рік EVO 2026</div>
  <h1>Претенденти</h1>
  <p class="lead" id="lead"></p>
</header>
  <section class="sl" id="sl" aria-labelledby="sl-h"></section>
  <h2 class="all-h" id="all-h">Усі претенденти</h2>
</div>

<div class="bar"><div class="wrap">
  <input class="search" id="q" type="search" placeholder="Пошук за ніком" autocomplete="off">
  <div class="seg" id="team" role="group" aria-label="Команда">
    <button data-v="all" aria-pressed="true">Усі</button><button data-v="EVO" aria-pressed="false">EVO</button><button data-v="REVO" aria-pressed="false">REVO</button><button data-v="COACH" aria-pressed="false">Тренери</button>
  </div>
  <div class="stages" id="stages" role="group" aria-label="Етап"></div>
  <select id="sort" aria-label="Сортування">
    <option value="nick">За ніком</option>
    <option value="rank">За рангом</option>
    <option value="distance">За дистанцією</option>
    <option value="abi">За ABI</option>
  </select>
  <div class="seg view" id="view" role="group" aria-label="Вигляд">
    <button data-v="cards" aria-pressed="true">Картки</button><button data-v="table" aria-pressed="false">Таблиця</button>
  </div>
  <span class="count" id="count"></span>
</div></div>

<main><div class="wrap"><div id="out"></div>
  <section id="staff" class="staff-sec" hidden><h2><span id="staff-title">Адмінсклад</span> <span id="staff-count"></span></h2>
    <p class="staff-lead">Адміни, коучі й психологи — люди, завдяки яким працює школа. Їх теж можна висувати в ком'юніті номінаціях.</p>
    <div id="staff-out"></div></section>
</div></main>

<footer><div class="wrap" id="foot">© 2026 Еволюція · <a href="https://evopoker.pro/">evopoker.pro</a></div></footer>

<script>
/* Дані — players.json поруч зі сторінкою (генерує scripts/awards_2026/player_cards.py). */
const STAGE_COLORS = ['#ecd089', '#e2b85c', '#d9a441', '#b7792f', '#8c5524'];   // як на головній
const STAGE_ROMAN = ['I', 'II', 'III', 'IV', 'V'];
const REVO_COLOR = '#f3e6c4', ADMIN_COLOR = '#c9614f';
const MONTHS = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('uk-UA');
const money = v => v == null ? '—' : '$' + (v >= 100 ? Math.round(v).toLocaleString('uk-UA') : Number(v).toFixed(1));
const stageOf = p => p.team === 'ADMIN' ? -1 : p.team === 'REVO' ? 0 : p.rank == null ? null : Math.min(5, Math.max(1, Math.ceil(p.rank / 4) || 1));
const colorOf = p => { const s = stageOf(p); return s === -1 ? ADMIN_COLOR : s === 0 ? REVO_COLOR : s ? STAGE_COLORS[s - 1] : 'var(--line)'; };
const labelOf = p => { const s = stageOf(p); return s === -1 ? 'Адмінсклад' : s === 0 ? 'REVO' : s ? STAGE_ROMAN[s - 1] + ' етап' : 'EVO'; };

// Ком'юніті номінації — як COMMUNITY на головній (index.html)
const NOMS = [
  { name: 'Найкращий блог', for: 'Найцікавіший блог гравця' },
  { name: 'Серце EVO', for: 'Людина, до якої йдеш з будь-чим' },
  { name: 'Харизма EVO', for: 'Заряджає всіх навколо' },
  { name: 'Тренер року', for: 'Найбільше дав своїм учням' },
  { name: 'Фолд року', for: 'Найкращий фолд року' },
];
const DEMO = new URLSearchParams(location.search).has('demo');
const QI = n => `<button type="button" class="qi" aria-expanded="false" aria-label="Хто потрапляє в список">i<span class="qi-tip" role="tooltip">У списку — гравці EVO і REVO, що зіграли від ${n} ентрі за рік у складі команди, і весь адмінсклад та тренерський склад.</span></button>`;
/* віконце «i»: на телефоні — натиском */
document.addEventListener('click', e => { const b = e.target.closest('.qi');
  document.querySelectorAll('.qi[aria-expanded="true"]').forEach(x => { if (x !== b) x.setAttribute('aria-expanded', 'false'); });
  if (b) b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); });

const COACH_COLOR = '#4fae9b';
const low = n => String(n || '').trim().toLowerCase();
const staffOf = nick => STAFF.find(x => low(x.nick) === low(nick));
const playerOf = nick => ALL.find(x => low(x.nick) === low(nick));
const nameOf = nick => NAMES[low(nick)] || '';
// спершу ім'я, потім нік (нік — дрібніше; пошук і сортування — за ніком)
const nickHtml = nick => nameOf(nick) ? `${esc(nameOf(nick))} <span class="nm">${esc(nick)}</span>` : esc(nick);
const isCoach = nick => COACHES.has(low(nick));
const staffColor = s => s.kind === 'coach' ? COACH_COLOR : ADMIN_COLOR;
const staffTitle = s => s.kind === 'coach' ? (s.role || 'Тренер') : s.role === 'Засновник' ? 'Засновник' : 'Адмін';
// гравець, якого немає серед карток (нижче порогу), але етап відомий — rank у staff
const staffPl = s => playerOf(s.nick) || (s.rank ? { team: 'EVO', rank: s.rank } : null);
// друга роль гравця: адмінсклад або тренер — друга половина обідка
const extraOf = p => { const s = staffOf(p.nick); if (s) return { c: staffColor(s), t: staffTitle(s) };
  return isCoach(p.nick) ? { c: COACH_COLOR, t: 'Тренер' } : null; };
const ringAttr = (cls, c1, c2) => `class="${cls}${c2 ? ' dual' : ''}" style="--stage:${c1}${c2 ? ';--stage2:' + c2 : ''}"`;
const rankTxt = p => p.rank != null && p.team !== 'REVO' ? ` · ранг ${p.rank}` : '';
let NAMES = {}, COACHES = new Set(), SHORT = [], STAFF = [], ALL = [], state = { q: '', team: 'all', stages: new Set(), sort: 'nick', view: 'cards', dir: -1 };
try { const s = JSON.parse(localStorage.getItem('evo_nominees_view2') || '{}'); if (s.view) state.view = s.view; if (['rank', 'distance', 'abi', 'nick'].includes(s.sort)) state.sort = s.sort; } catch (e) {}
const save = () => { try { localStorage.setItem('evo_nominees_view2', JSON.stringify({ view: state.view, sort: state.sort })); } catch (e) {} };

function stageButtons() {
  const opts = [{ v: '0', t: 'REVO', c: REVO_COLOR }, ...STAGE_ROMAN.map((r, i) => ({ v: String(i + 1), t: r, c: STAGE_COLORS[i] }))];
  $('#stages').innerHTML = opts.map(o => `<button data-v="${o.v}" aria-pressed="false" style="--c:${o.c}"><i></i>${o.t}</button>`).join('');
  $('#stages').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    state.stages.has(b.dataset.v) ? state.stages.delete(b.dataset.v) : state.stages.add(b.dataset.v);
    b.setAttribute('aria-pressed', state.stages.has(b.dataset.v)); render(); });
}
function seg(id, key) {
  const box = $(id);
  box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state[key]));
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v;
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); save(); render(); });
}
function sorted(list) {
  const k = state.sort, d = k === 'nick' ? 1 : state.dir;
  return [...list].sort((a, b) => {
    if (k === 'nick') return a.nick.localeCompare(b.nick, 'uk', { sensitivity: 'base' }) * (state.dir === 1 ? -1 : 1);
    const av = a[k] ?? -1, bv = b[k] ?? -1;
    return (bv - av) * (d === -1 ? 1 : -1) || a.nick.localeCompare(b.nick, 'uk');
  });
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return ALL.filter(p => (state.team === 'all' || (state.team === 'COACH' ? isCoach(p.nick) : p.team === state.team))
    && (!state.stages.size || state.stages.has(String(stageOf(p))))
    && (!q || p.nick.toLowerCase().includes(q) || (p.roomNick || '').toLowerCase().includes(q) || nameOf(p.nick).toLowerCase().includes(q)));
}
function card(p) {
  const av = p.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy">` : esc((p.nick || '?')[0].toUpperCase());
  const pending = !p.distance;
  const x = extraOf(p);
  return `<article ${ringAttr('ncard' + (pending ? ' pending' : ''), colorOf(p), x && x.c)}>
    <div class="who"><div class="avatar">${av}</div><div><div class="nick">${nickHtml(p.nick)}</div><div class="role"><b>${labelOf(p)}</b>${rankTxt(p)}${x ? ` · <span class="adm">${esc(x.t)}</span>` : ''}</div></div></div>
    <dl class="stats">
      <div><dt>Ентрі</dt><dd>${pending ? '—' : fmt(p.distance)}</dd></div>
      <div><dt>ABI за рік</dt><dd>${pending ? '—' : money(p.abi)}</dd></div>
    </dl>
    <p class="fact">${pending ? 'Дані з\'являться після перерахунку за повний рік' : esc(p.fact || '—')}</p>
  </article>`;
}
function table(list) {
  const th = (k, t, num) => `<th class="${num ? 'num' : ''}" data-k="${k}"${state.sort === k ? ' aria-sort="' + (state.dir === -1 ? 'descending' : 'ascending') + '"' : ''}>${t}${state.sort === k ? (state.dir === -1 ? ' ↓' : ' ↑') : ''}</th>`;
  return `<div class="tbl-wrap"><table><thead><tr>${th('nick', 'Гравець')}<th>Етап</th>${th('rank', 'Ранг', 1)}${th('abi', 'ABI за рік', 1)}${th('distance', 'Ентрі', 1)}<th>Факт</th></tr></thead><tbody>${
    list.map(p => { const x = extraOf(p); return `<tr style="--stage:${colorOf(p)}${x ? ';--stage2:' + x.c : ''}"><td><span class="dot${x ? ' dual' : ''}"></span>${nickHtml(p.nick)}</td><td>${labelOf(p)}${x ? ' · ' + esc(x.t) : ''}</td><td class="num">${p.team === 'REVO' ? '—' : (p.rank ?? '—')}</td><td class="num">${money(p.abi)}</td><td class="num">${p.distance ? fmt(p.distance) : '—'}</td><td class="fact-c">${esc(p.fact || '')}</td></tr>`; }).join('')
  }</tbody></table></div>`;
}
function staffCard(p) {
  const av = p.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy">` : esc((p.nick || '?')[0].toUpperCase());
  const pl = staffPl(p), c = staffColor(p), t = esc(staffTitle(p));
  return `<article ${ringAttr('ncard staff', pl ? colorOf(pl) : c, pl && c)}>
    <div class="who"><div class="avatar">${av}</div><div><div class="nick">${nickHtml(p.nick)}</div><div class="role">${pl ? `<b>${labelOf(pl)}</b>${rankTxt(pl)} · <span class="adm">${t}</span>` : `<b>${t}</b>`}</div></div></div>
    ${p.about ? `<p class="about">${esc(p.about)}</p>` : p.role === 'Засновник' ? '' : '<p class="about muted">Опис діяльності з\'явиться згодом</p>'}
  </article>`;
}
function staffTable(list) {
  return `<div class="tbl-wrap"><table><thead><tr><th>Нік</th><th>Роль</th><th>Діяльність</th></tr></thead><tbody>${
    list.map(p => { const pl = staffPl(p), c = staffColor(p); return `<tr style="--stage:${pl ? colorOf(pl) + ';--stage2:' + c : c}"><td><span class="dot${pl ? ' dual' : ''}"></span>${nickHtml(p.nick)}</td><td>${pl ? labelOf(pl) + rankTxt(pl) + ' · ' : ''}${esc(staffTitle(p))}</td><td class="fact-c">${esc(p.about || '—')}</td></tr>`; }).join('')
  }</tbody></table></div>`;
}
function renderStaff() {
  const q = state.q.trim().toLowerCase(), list = STAFF.filter(p => (!q || p.nick.toLowerCase().includes(q) || nameOf(p.nick).toLowerCase().includes(q)) && (state.team !== 'COACH' || p.kind === 'coach'))
    .sort((a, b) => a.nick.localeCompare(b.nick, 'uk', { sensitivity: 'base' }));
  $('#staff').hidden = !list.length || state.team === 'EVO' || state.team === 'REVO' || state.stages.size > 0;
  $('#staff-title').textContent = state.team === 'COACH' ? 'Тренерський склад' : 'Адмінсклад';
  $('#staff-count').textContent = `${list.length}`;
  $('#staff-out').innerHTML = state.view === 'table' ? staffTable(list) : `<div class="grid">${list.map(staffCard).join('')}</div>`;
}
function person(nick) {
  const k = String(nick).trim().toLowerCase();
  const p = ALL.find(x => x.nick.toLowerCase() === k); if (p) { const x = extraOf(p); return { ...p, c: colorOf(p), c2: x && x.c, l: labelOf(p) + (x ? ' · ' + x.t : '') }; }
  const s = STAFF.find(x => x.nick.toLowerCase() === k); if (s) { const pl = staffPl(s), c = staffColor(s);
    return { ...s, c: pl ? colorOf(pl) : c, c2: pl && c, l: (pl ? labelOf(pl) + ' · ' : '') + staffTitle(s) }; }
  return { nick, c: 'var(--line)', l: '' };
}
// приклад: по 3–5 різних людей на номінацію; «Тренер року» — з тренерів
function demoShortlists() {
  const pick = (src, n, seed) => Array.from({ length: n }, (_, i) => src[(seed * 11 + i * 17) % src.length]).filter((x, i, a) => a.indexOf(x) === i).map(x => x.nick);
  return NOMS.map((n, i) => ({ name: n.name, nominees: n.name === 'Тренер року' ? pick([...ALL.filter(x => isCoach(x.nick)), ...STAFF.filter(x => x.kind === 'coach')], 4, i) : pick(ALL, [5, 4, 4, 0, 3][i] || 4, i + 1) }));
}
function renderShort() {
  const lists = DEMO ? demoShortlists() : SHORT, by = Object.fromEntries(lists.map(x => [x.name, x.nominees || []]));
  const any = lists.some(x => (x.nominees || []).length);
  $('#sl').innerHTML = `<div class="sl-head"><div><h2 id="sl-h">Шортлист</h2>
      <p>${any ? 'Претенденти кожної ком\'юніті номінації за підсумками Nomination Week. Натисни на претендента — він знайдеться у списку нижче.'
        : 'Претендентів висувають учасники на Nomination Week, 16–22 листопада. Після неї шортлист кожної номінації з\'явиться тут.'}</p></div></div>
    ${DEMO ? '<div class="sl-demo"><b>Приклад</b>Претенденти тут вигадані — це лише вигляд блоку. Справжній шортлист з\'явиться після Nomination Week.</div>' : ''}
    <div class="sl-noms">${NOMS.map(n => { const list = by[n.name] || [];
      return `<div class="sl-nom"><div><h3>${esc(n.name)}</h3><p class="for">${esc(n.for)}</p></div>${list.length
        ? `<div class="sl-list">${list.map(nick => { const p = person(nick), av = p.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy">` : esc((p.nick || '?')[0].toUpperCase());
            return `<button type="button" ${ringAttr('sl-p', p.c, p.c2)} data-nick="${esc(p.nick)}"><span class="avatar">${av}</span><span><b>${esc(p.nick)}</b>${p.l ? `<small>${esc(p.l)}</small>` : ''}</span></button>`; }).join('')}</div>`
        : `<div class="sl-wait">Шортлист з'явиться після Nomination Week</div>`}</div>`; }).join('')}</div>`;
}
$('#sl').addEventListener('click', e => { const b = e.target.closest('.sl-p'); if (!b) return;
  state.q = b.dataset.nick; $('#q').value = b.dataset.nick; state.team = 'all'; state.stages.clear();
  document.querySelectorAll('#team button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'all'));
  document.querySelectorAll('#stages button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  render(); $('#all-h').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
function render() {
  renderStaff();
  const list = sorted(filtered());
  $('#count').textContent = `${list.length} з ${ALL.length}`;
  $('#sort').value = state.sort;
  $('#out').innerHTML = !list.length ? '<div class="grid"><p class="empty">Нікого не знайдено.</p></div>'
    : state.view === 'table' ? table(list) : `<div class="grid">${list.map(card).join('')}</div>`;
  $('#out').querySelectorAll('th[data-k]').forEach(t => t.addEventListener('click', () => {
    state.dir = state.sort === t.dataset.k ? -state.dir : -1; state.sort = t.dataset.k; save(); render(); }));
}
$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; state.dir = -1; save(); render(); });
stageButtons(); seg('#team', 'team'); seg('#view', 'view');

fetch('players.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  const hide = new Set((d.hidePlayers || []).map(low));
  ALL = (d.players || []).filter(p => !hide.has(low(p.nick))); STAFF = d.staff || []; SHORT = d.shortlists || [];
  COACHES = new Set((d.coaches || []).map(low)); NAMES = d.names || {};
  $('#lead').innerHTML = `Гравці EVO і REVO, тренери та адмінсклад із їхніми результатами за рік.${QI(fmt(d.minDistance || 1000))} Будь-кого з них можна висунути в ком'юніті номінаціях.`;
  renderShort();
  if (d.asOf) { const [y, m, dd] = d.asOf.split('-').map(Number);
    $('#foot').insertAdjacentHTML('afterbegin', `Дані станом на ${dd} ${MONTHS[m - 1]} ${y}; фінальні — після завершення Року EVO 30 листопада. `); }
  render();
}).catch(() => { $('#out').innerHTML = '<div class="grid"><p class="empty">Не вдалося завантажити дані.</p></div>'; });
</script>
</body>
</html>
